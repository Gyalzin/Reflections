<!--
This is the edit.html template file for the Flask application. 
It provides a form for editing an existing entry in the database. 
The form includes fields for activity name, start time, end time, mood, and note.
The values of these fields are pre-filled with the current values of the entry being edited.
When the form is submitted, it sends a POST request to the /update_entry/<entry_id> route to update the entry in the database.

Created by: Gyalzin Dorji
Date Created: 2026-10-28
Last Modified: 2026-10-28
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
</head>
<body>
    <h1>Edit entry</h1>
    <form method = "POST" action = "/update_entry/{{ entry['entry_id'] }}">
        <label>Activityn<input type = "text" name = "activity" value = "{{ entry['activity_name'] }}" required></label><br>
        <label>Start Time<input type = "datetime-local" name = "start_time" value = "{{ entry['start_time'] [:16].replace(' ', 'T') }}" required></label><br>
        <label>End Time<input type = "datetime-local" name = "end_time" value = "{{ entry['end_time'] [:16].replace(' ', 'T') }}" required></label><br>
        <label>Mood <input type="number" name="mood" min="1" max="5" value="{{ entry['mood'] if entry['mood'] is not none else '' }}"></label><br>
        <label>Note <textarea name = "note">{{ entry ['note'] or '' }}</textarea></label><br>
        <input type = "submit" value = "Save Changes">
    </form>
    <p>
        <a href = "/?day={{ entry['start_time'][:10] }}">Cancel</a>
    </p>
</body>
</html>
