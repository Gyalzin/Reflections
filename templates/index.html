<!--
This is the index.html file for the Reflections app. It displays a list of entries and provides a form to add new entries.
The entries are displayed in an unordered list, and each entry shows the start time, end time, and note (if available).
The form allows users to input activity, start time, end time, mood, and an optional note.
When the form is submitted, it sends a POST request to the /add_entry route to add the new entry to the database.

Created by: Gyalzin Dorji
Date Created: 2026-10-24
Last Modified: 2026-10-28
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflections</title>
</head>

<body>

    <h1>Reflections</h1>
    <p>Welcome to Reflections!</p>
    <h2> {{day}} </h2>
    <p>
        <a href = "/?day={{prev_day}}">&larr; Previous day</a>
        <a href = "/">Today</a>
        <a href = "/?day={{next_day}}">Next day &rarr;</a>
    </p>
    <ul>
        {% for e in entries %}
        <li>{{ e["start_time"] }} to {{ e["end_time"] }} {{ e["note"] or "" }}
            <form method = "POST" action = "/delete_entry/{{e['entry_id']}}" style = "display:inline"
                onsubmit = "return confirm('Delete this entry?');">
                <input type = "hidden" name = "day" value = "{{day}}">
                <button type = "submit">Delete</button>
            </form>
            <a href = "/edit_entry/{{e['entry_id']}}">Edit</a>
        </li>
        {% endfor %}
    </ul>

    <form method = "POST" action = "/save_entry">
        <label>Activity <input type = "text" name = "activity" required></label><br>
        <label>Start Time <input type = "datetime-local" name = "start_time" required> </label><br>
        <label>End Time <input type = "datetime-local" name = "end_time" required> </label><br>
        <label> Mood <input type = "number" name = "mood" min = "1" max = "5"> </label><br>
        <label> Note <textarea name = "note"></textarea> </label><br>
        <input type = "submit" value = "Save Entry">   
    </form>

</body>
</html>
